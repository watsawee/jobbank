!DOCTYPE html>
<html lang="en">
<head>
  <title>Student Job Bank System</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
 
  <script src="validate.js"></script>
  <script src="payRateCal.js"></script>
</head>
 
<body>
<div class="container mt-3">
 
  <form onsubmit="return validateForm()">
 
    <div class="mb-3">
      <label>National ID *</label>
      <input type="text" class="form-control" id="nid">
    </div>
 
    <div class="mb-3">
      <label>First Name *</label>
      <input type="text" class="form-control" id="fname">
    </div>
 
    <div class="mb-3">
      <label>Last Name *</label>
      <input type="text" class="form-control" id="lname">
    </div>
 
    <div class="mb-3">
      <label>Gender *</label><br>
      <input type="radio" name="genderRad"> Male
      <input type="radio" name="genderRad"> Female
      <input type="radio" name="genderRad"> Other
    </div>
 
    <div class="mb-3">
      <label>School *</label>
      <select class="form-select" id="school" name="school">
        <option value="">-- Select --</option>
        <option value="1">Science</option>
        <option value="2">Business</option>
        <option value="3">Law</option>
        <option value="4">Art</option>
      </select>
    </div>
 
    <div class="mb-3">
      <label>Year of Study *</label>
      <select class="form-select" id="year">
        <option value="">-- Select --</option>
        <option value="1">1st Year (55)</option>
        <option value="2">2nd Year (65)</option>
        <option value="3">3rd Year (75)</option>
        <option value="4">4th Year (85)</option>
      </select>
    </div>
 
    <div class="mb-3">
      <label>Work Days (1–6) *</label>
      <input type="text" class="form-control" id="workDays">
    </div>
 
    <button type="submit">Register</button>
    <button type="button" onclick="document.querySelector('form').reset()">Reset</button>
 
  </form>
 
</div>
</body>
</html>
